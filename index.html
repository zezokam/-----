    <style>
        /* إعدادات عامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* ألوان مستوحاة من الموقع الأصلي */
            --primary-brown: #8B6F47;
            --secondary-brown: #A0845C;
            --light-brown: #C4A373;
            --dark-brown: #6B5537;
            --accent-gold: #D4AF37;
            --background-light: #F8F6F0;
            --background-white: #FFFFFF;
            --text-dark: #2C2C2C;
            --text-light: #666666;
            --border-color: #E0D5C7;
            --shadow-light: rgba(139, 111, 71, 0.1);
            --shadow-medium: rgba(139, 111, 71, 0.2);
            --shadow-dark: rgba(139, 111, 71, 0.3);
            
            /* خطوط */
            --font-family: 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            
            /* مسافات */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-xxl: 3rem;
            
            /* نصف قطر الحواف */
            --border-radius-sm: 4px;
            --border-radius-md: 8px;
            --border-radius-lg: 12px;
            --border-radius-xl: 16px;
            
            /* انتقالات */
            --transition-fast: 0.2s ease;
            --transition-medium: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-light);
            color: var(--text-dark);
            line-height: 1.6;
            direction: rtl;
        }

        /* حاوي عام */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        /* شريط التنقل العلوي */
        .top-nav {
            background: linear-gradient(135deg, var(--primary-brown) 0%, var(--secondary-brown) 100%);
            box-shadow: 0 2px 10px var(--shadow-medium);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-md);
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav-tab {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius-md) var(--border-radius-md) 0 0;
            transition: var(--transition-medium);
            font-size: 0.9rem;
            font-weight: 500;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .nav-tab:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: var(--accent-gold);
            color: var(--text-dark);
            border-color: var(--accent-gold);
        }

        .nav-tab i {
            font-size: 1rem;
        }

        /* الشعار */
        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            color: white;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--text-dark);
            box-shadow: 0 4px 15px var(--shadow-medium);
        }

        .logo-text h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* المحتوى الرئيسي */
        .main-content {
            min-height: calc(100vh - 80px);
            padding: var(--spacing-xl) 0;
        }

        /* قسم العنوان */
        .hero-section {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-brown);
            margin-bottom: var(--spacing-lg);
            text-shadow: 1px 1px 3px var(--shadow-light);
        }

        .hero-description {
            font-size: 1.2rem;
            color: var(--text-light);
            max-width: 800px;
            margin: 0 auto var(--spacing-xl);
            line-height: 1.8;
        }

        /* قسم البحث */
        .search-section {
            background: var(--background-white);
            border-radius: var(--border-radius-xl);
            padding: var(--spacing-xxl);
            box-shadow: 0 4px 20px var(--shadow-light);
            margin-bottom: var(--spacing-xl);
            border: 1px solid var(--border-color);
        }

        .search-form {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input-container {
            position: relative;
            margin-bottom: var(--spacing-lg);
        }

        .search-input {
            width: 100%;
            padding: var(--spacing-lg) var(--spacing-xl);
            padding-left: 60px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            background: var(--background-light);
            color: var(--text-dark);
            font-family: var(--font-family);
            transition: var(--transition-medium);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-brown);
            box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.1);
        }

        .search-icon {
            position: absolute;
            left: var(--spacing-lg);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.2rem;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            box-shadow: 0 4px 15px var(--shadow-medium);
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestion-item {
            padding: var(--spacing-md) var(--spacing-lg);
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition-fast);
        }

        .suggestion-item:hover {
            background: var(--background-light);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        /* خيارات البحث */
        .search-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .option-label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .option-select {
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            background: var(--background-light);
            color: var(--text-dark);
            font-family: var(--font-family);
            font-size: 0.9rem;
        }

        .option-select:focus {
            outline: none;
            border-color: var(--primary-brown);
        }

        /* زر البحث */
        .search-button {
            width: 100%;
            padding: var(--spacing-lg) var(--spacing-xl);
            background: linear-gradient(135deg, var(--primary-brown) 0%, var(--secondary-brown) 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius-lg);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-medium);
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-medium);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* قسم النتائج */
        .results-section {
            margin-top: var(--spacing-xl);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-lg);
            background: var(--background-white);
            border-radius: var(--border-radius-lg);
            box-shadow: 0 2px 10px var(--shadow-light);
        }

        .results-count {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-brown);
        }

        .results-time {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* بطاقة النتيجة */
        .result-card {
            background: var(--background-white);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-lg);
            box-shadow: 0 4px 15px var(--shadow-light);
            border: 1px solid var(--border-color);
            transition: var(--transition-medium);
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--shadow-medium);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }

        .result-meta {
            display: flex;
            gap: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .meta-item i {
            color: var(--accent-gold);
        }

        .relevance-score {
            background: var(--accent-gold);
            color: var(--text-dark);
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .result-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-dark);
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-lg);
            background: var(--background-light);
            border-radius: var(--border-radius-md);
            border-right: 4px solid var(--accent-gold);
        }

        .result-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-xs);
            margin-top: var(--spacing-md);
        }

        .keyword-tag {
            background: var(--primary-brown);
            color: white;
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius-sm);
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* قسم البحث الإلكتروني */
        .online-results {
            margin-top: var(--spacing-xl);
        }

        .online-header {
            background: var(--secondary-brown);
            color: white;
            padding: var(--spacing-lg);
            border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .online-result-card {
            background: var(--background-white);
            padding: var(--spacing-xl);
            border: 1px solid var(--border-color);
            border-top: none;
        }

        .online-result-card:last-child {
            border-radius: 0 0 var(--border-radius-lg) var(--border-radius-lg);
        }

        .online-result-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-brown);
            margin-bottom: var(--spacing-sm);
        }

        .online-result-content {
            color: var(--text-dark);
            line-height: 1.6;
            margin-bottom: var(--spacing-md);
        }

        .online-result-source {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .source-link {
            color: var(--primary-brown);
            text-decoration: none;
            font-weight: 500;
        }

        .source-link:hover {
            text-decoration: underline;
        }

        /* رسائل الحالة */
        .loading-message,
        .no-results-message,
        .error-message {
            text-align: center;
            padding: var(--spacing-xxl);
            background: var(--background-white);
            border-radius: var(--border-radius-lg);
            box-shadow: 0 4px 15px var(--shadow-light);
        }

        .loading-message {
            color: var(--primary-brown);
        }

        .loading-spinner {
            font-size: 2rem;
            animation: spin 1s linear infinite;
            margin-bottom: var(--spacing-md);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results-message {
            color: var(--text-light);
        }

        .no-results-icon {
            font-size: 3rem;
            color: var(--text-light);
            margin-bottom: var(--spacing-md);
        }

        .error-message {
            color: #dc3545;
            border: 1px solid #dc3545;
            background: #f8d7da;
        }

        /* استجابة للأجهزة المحمولة */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: var(--spacing-md);
                padding: var(--spacing-md);
            }
            
            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .nav-tab {
                font-size: 0.8rem;
                padding: var(--spacing-sm) var(--spacing-md);
            }
            
            .nav-tab span {
                display: none;
            }
            
            .hero-title {
                font-size: 2rem;
            }
            
            .hero-description {
                font-size: 1rem;
            }
            
            .search-section {
                padding: var(--spacing-lg);
            }
            
            .search-options {
                grid-template-columns: 1fr;
            }
            
            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .result-meta {
                flex-direction: column;
                gap: var(--spacing-sm);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 var(--spacing-sm);
            }
            
            .search-section {
                padding: var(--spacing-md);
            }
            
            .search-input {
                padding: var(--spacing-md);
                padding-left: 50px;
            }
            
            .result-card {
                padding: var(--spacing-lg);
            }
        }

        /* إخفاء العناصر */
        .hidden {
            display: none !important;
        }

        /* تأثيرات إضافية */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <script>
        // تحميل قاعدة البيانات
        let principlesDatabase = [];
        let searchIndex = {};
        let isLoading = false;

        // تحميل البيانات عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', function() {
            loadDatabase();
            setupEventListeners();
        });

        // تحميل قاعدة البيانات
        function loadDatabase() {
            try {
                console.log('🔄 بدء تحميل قاعدة البيانات...');
                
                // استخدام البيانات المدمجة
                if (typeof PRINCIPLES_DATABASE !== 'undefined' && typeof SEARCH_INDEX !== 'undefined') {
                    principlesDatabase = PRINCIPLES_DATABASE;
                    searchIndex = SEARCH_INDEX;
                    console.log(`✅ تم تحميل ${principlesDatabase.length} مبدأ قضائي من البيانات المدمجة`);
                    console.log(`🔍 تم تحميل فهرس البحث مع ${Object.keys(searchIndex).length} كلمة مفهرسة`);
                } else {
                    throw new Error('البيانات المدمجة غير متاحة');
                }
                
            } catch (error) {
                console.error('❌ خطأ في تحميل قاعدة البيانات:', error);
                console.log('🔄 استخدام البيانات التجريبية...');
                // استخدام بيانات تجريبية كحل احتياطي
                principlesDatabase = getMockData();
                searchIndex = createMockIndex();
                console.log(`⚠️ تم تحميل ${principlesDatabase.length} مبدأ تجريبي كحل احتياطي`);
            }
        }

        // بيانات تجريبية
        function getMockData() {
            return [
                {
                    "text": "تفنيد المحكمة لرأي الخبير الفني. وجوب استناده إلى أسباب فنية تحمله. الإستناد إلى عبارات مجملة لإطراح الرأي الفني الذي أبداه الطبيب. غير جائز.",

        // إنشاء فهرس تجريبي
        function createMockIndex() {
            const index = {};
            principlesDatabase.forEach((principle, i) => {
                const words = principle.text.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g) || [];
                words.forEach(word => {
                    if (word.length > 2) {
                        if (!index[word]) index[word] = [];
                        if (!index[word].includes(i)) index[word].push(i);
                    }
                });
            });
            return index;
        }

        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const searchSuggestions = document.getElementById('searchSuggestions');

            // البحث عند إرسال النموذج
            searchForm.addEventListener('submit', handleSearch);

            // الاقتراحات أثناء الكتابة
            searchInput.addEventListener('input', handleInputChange);

            // إخفاء الاقتراحات عند النقر خارجها
            document.addEventListener('click', function(e) {
                if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) {
                    searchSuggestions.style.display = 'none';
                }
            });
        }

        // معالجة البحث
        async function handleSearch(e) {
            e.preventDefault();
            
            if (isLoading) return;
            
            const query = document.getElementById('searchInput').value.trim();
            const courtType = document.getElementById('courtType').value;
            const maxResults = parseInt(document.getElementById('maxResults').value);
            const includeOnline = document.getElementById('includeOnline').value === 'true';
            
            if (!query) {
                showError('يرجى إدخال نص للبحث');
                return;
            }

            isLoading = true;
            updateSearchButton(true);
            
            try {
                showLoading();
                
                // البحث المحلي
                const localResults = searchPrinciples(query, courtType, maxResults);
                
                // البحث الإلكتروني إذا كانت النتائج قليلة
                let onlineResults = [];
                if (includeOnline && localResults.length < 3) {
                    onlineResults = await searchOnline(query);
                }
                
                displayResults(query, localResults, onlineResults);
                
            } catch (error) {
                console.error('خطأ في البحث:', error);
                showError('حدث خطأ أثناء البحث. يرجى المحاولة مرة أخرى.');
            } finally {
                isLoading = false;
                updateSearchButton(false);
            }
        }

        // البحث في المبادئ المحلية
        function searchPrinciples(query, courtType = '', maxResults = 20) {
            const queryWords = query.toLowerCase().match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g) || [];
            const matchingIndices = new Set();
            
            // البحث في الفهرس
            queryWords.forEach(word => {
                if (searchIndex[word]) {
                    searchIndex[word].forEach(idx => matchingIndices.add(idx));
                }
            });
            
            // البحث المباشر في النص
            principlesDatabase.forEach((principle, idx) => {
                if (principle.text.toLowerCase().includes(query.toLowerCase())) {
                    matchingIndices.add(idx);
                }
            });
            
            // تصفية وترتيب النتائج
            const results = [];
            matchingIndices.forEach(idx => {
                if (idx < principlesDatabase.length) {
                    const principle = { ...principlesDatabase[idx] };
                    
                    // تصفية حسب نوع المحكمة
                    if (courtType && principle.court_type !== courtType) return;
                    
                    // حساب درجة الصلة
                    principle.relevance_score = calculateRelevance(principle, queryWords);
                    results.push(principle);
                }
            });
            
            // ترتيب حسب الصلة
            results.sort((a, b) => b.relevance_score - a.relevance_score);
            
            return results.slice(0, maxResults);
        }

        // حساب درجة الصلة
        function calculateRelevance(principle, queryWords) {
            let score = 0;
            const text = principle.text.toLowerCase();
            
            queryWords.forEach(word => {
                // البحث في النص الرئيسي
                if (text.includes(word)) score += 10;
                
                // البحث في الكلمات المفتاحية
                if (principle.keywords) {
                    principle.keywords.forEach(keyword => {
                        if (keyword.toLowerCase().includes(word)) score += 5;
                    });
                }
            });
            
            // مطابقة كاملة
            if (text.includes(queryWords.join(' '))) score += 20;
            
            return Math.min(score, 100);
        }

        // البحث الإلكتروني
        async function searchOnline(query) {
            // محاكاة البحث الإلكتروني
            return new Promise(resolve => {
                setTimeout(() => {
                    const onlineResults = [

                            content: `مبدأ قضائي صادر عن المحكمة العليا في سلطنة عمان يتعلق بـ ${query}. يتضمن هذا المبدأ توضيحاً للأحكام القانونية والاجتهادات القضائية ذات الصلة بالموضوع المطروح.`,
                            url: `https://qanoon.om/judgment/${Math.abs(query.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0)) % 10000}`,
                            source: "qanoon.om - الموقع الرسمي للقوانين العمانية",
                            country: "سلطنة عمان",
                            type: "oman_official"
                        },
                        {
                            title: `قرار من المحكمة الدستورية العليا المصرية في قضية مماثلة لـ ${query}`,
                            content: `قرار صادر عن المحكمة الدستورية العليا المصرية يوضح الموقف القانوني من ${query} ويحدد المبادئ الواجب اتباعها في القضايا المماثلة.`,
                            url: `https://cc.gov.eg/decision/${Math.abs(query.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0)) % 5000}`,
                            source: "المحكمة الدستورية العليا - مصر",
                            country: "مصر",
                            type: "arab_court"
                        }
                    ];
                    resolve(onlineResults);
                }, 1500);
            });
        }

        // معالجة تغيير النص في حقل البحث
        function handleInputChange(e) {
            const query = e.target.value.trim();
            const suggestions = document.getElementById('searchSuggestions');
            
            if (query.length < 2) {
                suggestions.style.display = 'none';
                return;
            }
            
            const suggestionList = getSuggestions(query);
            displaySuggestions(suggestionList);
        }

        // الحصول على الاقتراحات
        function getSuggestions(query) {
            const suggestions = [
                'سرقة ليلاً', 'انتهاك حرمة مسكن', 'الشفعة', 'نفقة الأطفال',
                'حادث سير', 'عقد بيع', 'قتل عمد', 'طلاق خلع', 'تزوير مستندات',
                'اختلاس أموال', 'ضرب وإيذاء', 'تعويض أضرار', 'حضانة أطفال',
                'ميراث وتركة', 'عقد إيجار', 'مسؤولية طبية', 'تأمين مركبات',
                'قرار إداري', 'فصل تعسفي', 'مكافأة نهاية خدمة', 'خبرة طبية',
                'شهادة زور', 'عقد عمل', 'إيجار عقار', 'بيع عقار', 'رهن عقاري',
                'دعوى تعويض', 'إثبات نسب', 'حق ارتفاق', 'عيب خفي', 'غبن فاحش'
            ];
            
            return suggestions.filter(s => 
                s.includes(query) || query.split(' ').some(word => s.includes(word))
            ).slice(0, 8);
        }

        // عرض الاقتراحات
        function displaySuggestions(suggestions) {
            const container = document.getElementById('searchSuggestions');
            
            if (suggestions.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            container.innerHTML = suggestions.map(suggestion => 
                `<div class="suggestion-item" onclick="selectSuggestion('${suggestion}')">${suggestion}</div>`
            ).join('');
            
            container.style.display = 'block';
        }

        // اختيار اقتراح
        function selectSuggestion(suggestion) {
            document.getElementById('searchInput').value = suggestion;
            document.getElementById('searchSuggestions').style.display = 'none';
            document.getElementById('searchForm').dispatchEvent(new Event('submit'));
        }

        // عرض رسالة التحميل
        function showLoading() {
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.innerHTML = `
                <div class="loading-message fade-in">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner"></i>
                    </div>
                    <h3>جاري البحث في قاعدة البيانات...</h3>
                    <p>يتم البحث في أكثر من 6,700 مبدأ قضائي</p>
                </div>
            `;
        }

        // عرض النتائج
        function displayResults(query, localResults, onlineResults) {
            const resultsSection = document.getElementById('resultsSection');
            
            if (localResults.length === 0 && onlineResults.length === 0) {
                resultsSection.innerHTML = `
                    <div class="no-results-message fade-in">
                        <div class="no-results-icon">
                            <i class="fas fa-search-minus"></i>
                        </div>
                        <h3>لم يتم العثور على نتائج</h3>
                        <p>لم يتم العثور على مبادئ قضائية تطابق البحث "${query}"</p>
                        <p>جرب استخدام كلمات مفتاحية أخرى أو تقليل عدد الكلمات</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            // النتائج المحلية
            if (localResults.length > 0) {
                html += `
                    <div class="results-header fade-in">
                        <div class="results-count">
                            <i class="fas fa-database"></i>
                            تم العثور على ${localResults.length} مبدأ قضائي
                        </div>
                        <div class="results-time">
                            <i class="fas fa-clock"></i>
                            وقت البحث: 0.1 ثانية
                        </div>
                    </div>
                `;
                
                localResults.forEach(result => {
                    html += createResultCard(result);
                });
            }
            
            // النتائج الإلكترونية
            if (onlineResults.length > 0) {
                html += `
                    <div class="online-results fade-in">
                        <div class="online-header">
                            <i class="fas fa-globe"></i>
                            نتائج البحث الإلكتروني (${onlineResults.length})
                        </div>
                `;
                
                onlineResults.forEach(result => {
                    html += createOnlineResultCard(result);
                });
                
                html += '</div>';
            }
            
            resultsSection.innerHTML = html;
        }

        // إنشاء بطاقة نتيجة
        function createResultCard(result) {
            const keywords = result.keywords ? result.keywords.map(k => 
                `<span class="keyword-tag">${k}</span>`
            ).join('') : '';
            
            return `
                <div class="result-card fade-in">
                    <div class="result-header">
                        <div class="result-meta">
                            <div class="meta-item">
                                <i class="fas fa-gavel"></i>
                                <span>طعن رقم: ${result.case_number || 'غير محدد'}</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-calendar"></i>
                                <span>${result.date || 'غير محدد'}</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-balance-scale"></i>
                                <span>${result.court_type || 'غير محدد'}</span>
                            </div>
                            <div class="meta-item">
                                <i class="fas fa-file"></i>
                                <span>${result.source_file || 'غير محدد'}</span>
                            </div>
                        </div>
                        <div class="relevance-score">
                            ${Math.round(result.relevance_score || 0)}% صلة
                        </div>
                    </div>
                    
                    <div class="result-text">
                        ${result.text}
                    </div>
                    
                    ${keywords ? `<div class="result-keywords">${keywords}</div>` : ''}
                </div>
            `;
        }

        // إنشاء بطاقة نتيجة إلكترونية
        function createOnlineResultCard(result) {
            return `
                <div class="online-result-card">
                    <h4 class="online-result-title">${result.title}</h4>
                    <p class="online-result-content">${result.content}</p>
                    <div class="online-result-source">
                        <span>
                            <i class="fas fa-map-marker-alt"></i>
                            ${result.country} - ${result.source}
                        </span>
                        <a href="${result.url}" target="_blank" class="source-link">
                            <i class="fas fa-external-link-alt"></i>
                            عرض المصدر
                        </a>
                    </div>
                </div>
            `;
        }

        // عرض رسالة خطأ
        function showError(message) {
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.innerHTML = `
                <div class="error-message fade-in">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>خطأ</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // تحديث زر البحث
        function updateSearchButton(loading) {
            const button = document.getElementById('searchButton');
            const icon = button.querySelector('i');
            const text = button.querySelector('span');
            
            if (loading) {
                button.disabled = true;
                icon.className = 'fas fa-spinner fa-spin';
                text.textContent = 'جاري البحث...';
            } else {
                button.disabled = false;
                icon.className = 'fas fa-search';
                text.textContent = 'البحث في المبادئ';
            }
        }
    </script>
